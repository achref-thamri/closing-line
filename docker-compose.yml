# Production: Postgres, the worker, the dashboard and a nightly backup, on the same server as the trading bot.
# Secrets come from .env (see .env.example); POSTGRES_PASSWORD is only needed here.
name: closing-line
services:
    postgres:
        image: postgres:18
        restart: unless-stopped
        environment:
            POSTGRES_USER: closing_line
            POSTGRES_DB: closing_line
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "closing_line", "-d", "closing_line"]
            interval: 10s
            timeout: 5s
            retries: 10
        mem_limit: 512m
        logging: &logging
            driver: json-file
            options:
                max-size: 10m
                max-file: "5"

    worker:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: closing-line-worker:latest
        restart: unless-stopped
        env_file: .env
        environment:
            DATABASE_URL: postgres://closing_line:${POSTGRES_PASSWORD}@postgres:5432/closing_line
            HEARTBEAT_PATH: /data/heartbeat
        volumes:
            - worker-data:/data
        depends_on:
            postgres:
                condition: service_healthy
        mem_limit: 512m
        logging: *logging

    web:
        build:
            context: .
            dockerfile: docker/web.Dockerfile
        image: closing-line-web:latest
        restart: unless-stopped
        environment:
            DATABASE_URL: postgres://closing_line:${POSTGRES_PASSWORD}@postgres:5432/closing_line
        # Only on the server's loopback: open it through an SSH tunnel (see the README).
        ports:
            - "127.0.0.1:3000:3000"
        depends_on:
            postgres:
                condition: service_healthy
        mem_limit: 384m
        logging: *logging

    backup:
        image: postgres:18
        restart: unless-stopped
        entrypoint: ["/bin/sh", "/backup.sh"]
        environment:
            PGHOST: postgres
            PGUSER: closing_line
            PGDATABASE: closing_line
            PGPASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - ./docker/backup.sh:/backup.sh:ro
            - backups:/backups
        depends_on:
            postgres:
                condition: service_healthy
        mem_limit: 128m
        logging: *logging

volumes:
    pgdata:
    worker-data:
    backups:
