version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: saturday
      groups:
          dev-tooling:
              dependency-type: development
              update-types: [minor, patch]
          runtime:
              dependency-type: production
              update-types: [minor, patch]
      ignore:
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]
          - dependency-name: typescript
            update-types: ["version-update:semver-major"]
    # Actions are pinned to commit SHAs; Dependabot moves the SHA and the version comment together.
    - package-ecosystem: github-actions
      directories: ["/", "/.github/actions/*"]
      schedule:
          interval: weekly
          day: saturday
    # Base images in docker/*.Dockerfile (Node).
    - package-ecosystem: docker
      directory: /docker
      schedule:
          interval: weekly
          day: saturday
      ignore:
          # Stay on the Node LTS line from .nvmrc; moving to the next LTS is a deliberate change.
          - dependency-name: node
            update-types: ["version-update:semver-major"]
    # Images in docker-compose.yml (Postgres, also used by the backup service).
    - package-ecosystem: docker-compose
      directory: /
      schedule:
          interval: weekly
          day: saturday
      ignore:
          # A Postgres major needs a dump and restore (pg_upgrade), never an automatic bump.
          - dependency-name: postgres
            update-types: ["version-update:semver-major"]
