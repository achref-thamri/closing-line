name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --prod --audit-level high
            - run: pnpm format:check
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm test:coverage
            - name: Coverage summary
              if: always()
              run: |
                  if [ -f coverage/coverage-summary.json ]; then
                      node -e 'const t = require("./coverage/coverage-summary.json").total;
                      console.log("| Metric | Coverage |\n|---|---|");
                      for (const k of ["statements", "branches", "functions", "lines"]) console.log(`| ${k} | ${t[k].pct}% |`);' >> "$GITHUB_STEP_SUMMARY"
                  fi

    postgres:
        name: Postgres 18
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: bot
                    POSTGRES_PASSWORD: bot
                    POSTGRES_DB: betting_test
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U bot" --health-interval 5s --health-timeout 5s --health-retries 10
        env:
            TEST_DATABASE_URL: postgres://bot:bot@localhost:5432/betting_test
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec vitest run --project @closing-line/db

    docker:
        name: Docker smoke test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - name: Fake secrets
              run: |
                  cat > .env <<'ENV'
                  ODDS_API_KEY=ci-fake
                  FOOTBALL_DATA_TOKEN=ci-fake
                  TELEGRAM_BOT_TOKEN=1:ci-fake
                  TELEGRAM_OWNER_CHAT_ID=1
                  POSTGRES_PASSWORD=ci-password
                  ENV
            - run: docker compose build worker web
            - name: Start Postgres, the worker and the dashboard
              run: docker compose up -d postgres worker web
            - name: Wait for the worker to report healthy
              run: |
                  container=$(docker compose ps -q worker)
                  for _ in $(seq 1 40); do
                      status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
                      echo "worker: $status"
                      [ "$status" = healthy ] && exit 0
                      sleep 5
                  done
                  docker compose logs worker
                  exit 1
            - name: Migrations ran on Postgres 18
              run: docker compose exec -T postgres psql -U betting -d betting -tAc "select count(*) from players" | grep -qx 2
            - name: The dashboard serves the real database on loopback only
              run: |
                  for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3000 -o page.html && break; sleep 2; done
                  grep -q "Value scanner" page.html
                  ! grep -q "Demo data" page.html
                  docker compose port web 3000 | grep -q "^127.0.0.1:"
            - name: Logs
              if: always()
              run: docker compose logs --tail=50 worker web

    dashboard:
        name: Dashboard end-to-end
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @closing-line/web build
            - run: pnpm --filter @closing-line/web exec playwright install --with-deps chromium
            - run: pnpm --filter @closing-line/web e2e
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: apps/web/test-results
