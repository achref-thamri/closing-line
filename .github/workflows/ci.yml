name: CI

on:
    push:
        branches: [main]
    pull_request:

# A newer push to a pull request replaces its run; every commit on main finishes, so each one has a result.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: pnpm audit --prod --audit-level high
            - run: pnpm format:check
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm test:coverage
            - name: Coverage summary
              if: always()
              run: |
                  if [ -f coverage/coverage-summary.json ]; then
                      node -e 'const t = require("./coverage/coverage-summary.json").total;
                      console.log("| Metric | Coverage |\n|---|---|");
                      for (const k of ["statements", "branches", "functions", "lines"]) console.log(`| ${k} | ${t[k].pct}% |`);' >> "$GITHUB_STEP_SUMMARY"
                  fi

    docker:
        name: Docker smoke test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Fake secrets
              run: |
                  cat > .env <<'ENV'
                  ODDS_API_KEY=ci-fake
                  FOOTBALL_DATA_TOKEN=ci-fake
                  TELEGRAM_BOT_TOKEN=1:ci-fake
                  TELEGRAM_OWNER_CHAT_ID=1
                  POSTGRES_PASSWORD=ci-password
                  ENV
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            # Layers come from the Actions cache, one scope per image so the two builds don't evict each other.
            - name: Build the worker and dashboard images
              uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
              with:
                  files: docker-compose.yml
                  targets: worker,web
                  load: true
                  set: |
                      worker.cache-from=type=gha,scope=worker
                      worker.cache-to=type=gha,scope=worker,mode=max
                      web.cache-from=type=gha,scope=web
                      web.cache-to=type=gha,scope=web,mode=max
            - name: Start Postgres, the worker and the dashboard
              run: docker compose up -d --no-build postgres worker web
            # Runs the image's own healthcheck command every few seconds; Docker's 60s interval would idle a billed minute.
            - name: Wait for the worker to report healthy
              run: |
                  for _ in $(seq 1 60); do
                      docker compose exec -T worker node apps/worker/src/healthcheck.ts && exit 0
                      sleep 3
                  done
                  docker compose logs worker
                  exit 1
            - name: Migrations ran on Postgres 18
              run: docker compose exec -T postgres psql -U closing_line -d closing_line -tAc "select count(*) from players" | grep -qx 2
            - name: The dashboard serves the real database on loopback only
              run: |
                  for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3000 -o page.html && break; sleep 2; done
                  grep -q "Value scanner" page.html
                  ! grep -q "Demo data" page.html
                  docker compose port web 3000 | grep -q "^127.0.0.1:"
            - name: Logs
              if: always()
              run: docker compose logs --tail=50 worker web

    # Postgres runs here rather than in its own job: billing rounds every job up to a whole minute.
    dashboard:
        name: Dashboard end-to-end and Postgres 18
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: bot
                    POSTGRES_PASSWORD: bot
                    POSTGRES_DB: closing_line_test
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U bot" --health-interval 5s --health-timeout 5s --health-retries 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - name: Repository tests on Postgres 18
              run: pnpm exec vitest run --project @closing-line/db
              env:
                  TEST_DATABASE_URL: postgres://bot:bot@localhost:5432/closing_line_test
            - run: pnpm --filter @closing-line/web build
            - run: pnpm --filter @closing-line/web exec playwright install --with-deps chromium
            - run: pnpm --filter @closing-line/web e2e
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: playwright-report
                  path: apps/web/test-results
